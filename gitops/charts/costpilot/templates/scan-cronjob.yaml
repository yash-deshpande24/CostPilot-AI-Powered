{{- if .Values.scanJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: costpilot-scan
  labels:
    app.kubernetes.io/name: scan
    {{- include "costpilot.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scanJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scan
            {{- include "costpilot.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Values.serviceAccounts.worker.name }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: scan
              image: {{ include "costpilot.image" (dict "root" . "repository" .Values.backend.repository) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "src/jobs/scan.js"]
              env:
                {{- include "costpilot.env" . | nindent 16 }}
              envFrom:
                - secretRef:
                    name: {{ .Values.secrets.existingSecret }}
              resources:
                {{- toYaml .Values.scanJob.resources | nindent 16 }}
              securityContext:
                {{- include "costpilot.backendSecurity" . | nindent 16 }}
{{- end }}
