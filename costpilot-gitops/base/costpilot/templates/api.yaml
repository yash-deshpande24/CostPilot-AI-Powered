apiVersion: apps/v1
kind: Deployment
metadata:
  name: costpilot-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: costpilot-api }
  template:
    metadata:
      labels: { app: costpilot-api }
    spec:
      serviceAccountName: costpilot-api
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/costpilot-api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.api.port }} }]
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "{{ .Values.api.port }}"
            - name: AWS_REGION
              value: ap-south-1
---
apiVersion: v1
kind: Service
metadata:
  name: costpilot-api
spec:
  selector: { app: costpilot-api }
  ports: [{ name: http, port: 3000, targetPort: http }]
