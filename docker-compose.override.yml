# Docker Compose merges this file into docker-compose.yml automatically.
services:
  backend:
    environment:
      COST_SOURCE: ${COST_SOURCE:-mock}
      CACHE_HOURS: ${CACHE_HOURS:-24}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_PRICE_INPUT_PER_MTOK: ${AI_PRICE_INPUT_PER_MTOK:-}
      AI_PRICE_OUTPUT_PER_MTOK: ${AI_PRICE_OUTPUT_PER_MTOK:-}
      SHOW_RESET_LINK: ${SHOW_RESET_LINK:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-yash-deshpande24/CostPilot-AI-Powered}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      PR_MODE: ${PR_MODE:-}
      PR_DIR: ${PR_DIR:-costpilot-gitops/remediations}
      PR_DAILY_LIMIT: ${PR_DAILY_LIMIT:-10}
