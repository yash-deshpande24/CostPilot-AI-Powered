name: Deploy dev

# On every merge to main that changes app code: build the images, push them to ECR,
# then write the new image tag into costpilot-gitops/envs/dev/values.yaml.
# ArgoCD sees that commit and rolls the new version out to the cluster.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub prove its identity to AWS (no AWS keys stored)
  contents: write # lets the job commit the new image tag

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pick the image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for name in backend frontend; do
            docker build -t "$REGISTRY/costpilot/$name:$TAG" "./$name"
            docker push "$REGISTRY/costpilot/$name:$TAG"
          done

      - name: Set the new tag in the dev values
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i "s|^\(  tag:\).*|\1 ${TAG}|" costpilot-gitops/envs/dev/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add costpilot-gitops/envs/dev/values.yaml
          git commit -m "ci: set dev image tag ${TAG}" || { echo "Nothing to commit"; exit 0; }
          git push
