name: CI

on:
  workflow_dispatch: # the Run workflow button in the Actions tab
  pull_request:
  push:
    branches: [main]
    # Promotion commits only touch gitops/, so they must not rebuild images.
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-south-1

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build

  infra:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate every environment
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  gitops:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Lint and validate for each environment
        run: |
          for env in dev prod; do
            echo "== $env"
            helm lint gitops/charts/costpilot -f "gitops/envs/$env/values.yaml"
            helm template costpilot gitops/charts/costpilot -f "gitops/envs/$env/values.yaml" \
              | ./kubeconform -strict -summary -kubernetes-version 1.35.0
          done

  images:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "costpilot/${{ matrix.image }}:ci" "./${{ matrix.image }}"
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: costpilot/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: Push images to ECR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend, infra, gitops, images]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job ask AWS for temporary credentials
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$ROLE" || { echo "::error::Add the AWS_ROLE_ARN variable in Settings > Secrets and variables > Actions > Variables"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          for image in backend frontend; do
            docker build -t "$REGISTRY/costpilot/$image:$TAG" "./$image"
            docker push "$REGISTRY/costpilot/$image:$TAG"
          done
          {
            echo "### Images pushed"
            echo ""
            echo "Tag: \`$TAG\`"
            echo ""
            echo "Next: run the Jenkins job **costpilot-promote** with IMAGE_TAG=\`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"