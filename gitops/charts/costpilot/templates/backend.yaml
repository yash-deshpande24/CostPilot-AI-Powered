# The API runs as an Argo Rollout, not a plain Deployment, so a new version goes out as a canary:
# part of the traffic first, a health analysis, then the rest. A failed analysis rolls back on its own.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app.kubernetes.io/name: backend
    {{- include "costpilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    canary:
      stableService: {{ .Values.backend.name }}
      canaryService: {{ .Values.backend.name }}-canary
      steps:
        - setWeight: {{ .Values.rollout.canaryWeight }}
        - pause: { duration: {{ .Values.rollout.pauseSeconds | quote }} }
        - analysis:
            templates:
              - templateName: backend-health
            args: []
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        {{- include "costpilot.labels" . | nindent 8 }}
      annotations:
        # Datadog reads the /metrics page of this container (see gitops/platform/datadog).
        ad.datadoghq.com/backend.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:{{ .Values.backend.port }}/metrics",
                  "namespace": "",
                  "metrics": [".*"]
                }
              ]
            }
          }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.backend.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: backend
          image: {{ include "costpilot.image" (dict "root" . "repository" .Values.backend.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- include "costpilot.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "costpilot.backendSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app.kubernetes.io/name: backend
    {{- include "costpilot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
# Where the new version runs while the canary is being checked. Argo Rollouts manages its selector.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-canary
  labels:
    app.kubernetes.io/name: backend
    {{- include "costpilot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
