# Copies the Datadog API key from AWS Secrets Manager (costpilot-dev/datadog) into the datadog namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: costpilot-dev/datadog
        property: api-key
    - secretKey: app-key
      remoteRef:
        key: costpilot-dev/datadog
        property: app-key
