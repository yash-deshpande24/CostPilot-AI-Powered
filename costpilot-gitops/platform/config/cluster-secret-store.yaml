# Tells External Secrets how to reach AWS Secrets Manager. It uses the IRSA role on the operator's
# service account, so no AWS keys are stored anywhere in the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
