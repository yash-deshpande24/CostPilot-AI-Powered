name: CI

on:
  workflow_dispatch: # the Run workflow button in the Actions tab
  pull_request:
  push:
    branches: [main]
    # Promotion commits only touch gitops/, so they must not rebuild images.
    paths-ignore:
      - "costpilot-gitops/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-south-1

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  infra:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate every environment
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  gitops:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          set -e
          curl -sSfL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -v

      - name: Lint and validate for each environment
        run: |
          set -e
          for env in dev prod; do
            echo "== $env"
            helm lint costpilot-gitops/charts/costpilot -f "costpilot-gitops/envs/$env/values.yaml"
            # Write to a file first, so a Helm error fails the step (a pipe would hide it).
            helm template costpilot costpilot-gitops/charts/costpilot \
              -f "costpilot-gitops/envs/$env/values.yaml" > "rendered-$env.yaml"
            # Standard schemas plus the community CRD catalog (Argo Rollouts, External Secrets).
            ./kubeconform -strict -summary -ignore-missing-schemas \
              -kubernetes-version 1.35.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "rendered-$env.yaml"
          done

  images:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --pull -t "costpilot/${{ matrix.image }}:ci" "./${{ matrix.image }}"

      # Runs the official Trivy image directly. The mounted Docker socket lets Trivy
      # read the image that was just built on this runner.
      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            costpilot/${{ matrix.image }}:ci

  publish:
    name: Push images to ECR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend, infra, gitops, images]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job ask AWS for temporary credentials
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test -n "$ROLE" || { echo "::error::Add the AWS_ROLE_ARN variable in Settings > Secrets and variables > Actions > Variables"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          for image in backend frontend; do
            docker build --pull -t "$REGISTRY/costpilot/$image:$TAG" "./$image"
            docker push "$REGISTRY/costpilot/$image:$TAG"
          done
          {
            echo "### Images pushed"
            echo ""
            echo "Tag: \`$TAG\`"
            echo ""
            echo "Next: run the Jenkins job **costpilot-promote** with IMAGE_TAG=\`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"