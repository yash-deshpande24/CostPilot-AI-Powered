{{- if .Values.secrets.fromAws }}
# Builds the costpilot-secrets Kubernetes secret from AWS Secrets Manager. Refreshes every hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "costpilot.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.awsSecretKey | quote }}
{{- end }}
