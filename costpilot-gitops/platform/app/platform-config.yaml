# Applies the secret store and the Datadog secret. Apply AFTER external-secrets is Synced,
# because these files use CRDs that the operator installs.
# Apply once: kubectl apply -f costpilot-gitops/platform/apps/platform-config.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yash-deshpande24/CostPilot-AI-Powered.git
    targetRevision: main
    path: costpilot-gitops/platform/config
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
