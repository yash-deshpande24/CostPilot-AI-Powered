# Settings for the production environment.
# Jenkins writes the image tag here when you promote to prod and approve it.
# Nothing deploys from this file until the prod cluster exists and costpilot-prod.yaml is applied there.

image:
  registry: "208805233492.dkr.ecr.ap-south-1.amazonaws.com"
  tag: "CHANGE_ME"

serviceAccounts:
  backend:
    roleArn: "arn:aws:iam::208805233492:role/costpilot-prod-backend"
  worker:
    roleArn: "arn:aws:iam::208805233492:role/costpilot-prod-worker"

backend:
  replicas: 2

frontend:
  replicas: 2

config:
  costSource: aws

mongodb:
  internal:
    enabled: false # use MongoDB Atlas: put its connection string in the secret as MONGO_URI
