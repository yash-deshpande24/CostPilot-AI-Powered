nameOverride: ""
namespace: costpilot
image:
  registry: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com
  tag: "REPLACE_WITH_IMMUTABLE_TAG"
  pullPolicy: IfNotPresent
api:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
frontend:
  replicas: 2
  port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
service:
  type: ClusterIP
ingress:
  enabled: false
  className: nginx
  host: costpilot.example.com
  tlsSecret: costpilot-tls
externalSecret:
  enabled: false
  secretStoreName: aws-secrets-manager
  remoteKey: costpilot/dev
