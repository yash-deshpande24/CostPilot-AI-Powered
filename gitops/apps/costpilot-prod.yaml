# DO NOT apply this to your dev cluster. It would deploy production settings next to dev.
# Apply it only on the production cluster, after: terraform apply in terraform/envs/prod
#   kubectl apply -f gitops/apps/costpilot-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: costpilot-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/yash-deshpande24/CostPilot-AI-Powered.git
    targetRevision: main
    path: gitops/charts/costpilot
    helm:
      valueFiles:
        - ../../envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: costpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
