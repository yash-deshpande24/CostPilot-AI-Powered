name: Deploy dev

# Runs only on main. Builds the images, pushes them to ECR, then writes the new tag
# into gitops/envs/dev/values.yaml. ArgoCD deploys that commit.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub prove its identity to AWS (no AWS keys stored)
  contents: write # lets the job commit the new image tag

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy:
    # Never push a tag to main from a feature branch, even if someone clicks Run workflow there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pick the image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for name in backend frontend; do
            docker build --pull -t "$REGISTRY/costpilot/$name:$TAG" "./$name"
            docker push "$REGISTRY/costpilot/$name:$TAG"
          done

      - name: Set the new tag in the dev values
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VALUES="gitops/envs/dev/values.yaml"
          test -f "$VALUES" || { echo "::error::$VALUES not found"; exit 1; }

          # Replace the tag line under "image:" and keep the quotes so it is read as a string.
          sed -i -E "s|^([[:space:]]*tag:).*$|\1 \"${TAG}\"|" "$VALUES"
          grep -q "tag: \"${TAG}\"" "$VALUES" || { echo "::error::The tag line was not updated"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          if git diff --cached --quiet; then
            echo "Tag is already ${TAG}. Nothing to commit."
            exit 0
          fi
          git commit -m "ci: set dev image tag ${TAG}"

          # Jenkins may have pushed a commit while this run was going, so rebase first.
          git pull --rebase origin main
          git push origin HEAD:main