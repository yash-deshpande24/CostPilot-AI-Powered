{{- if .Values.smokeTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: costpilot-smoke
  labels:
    app.kubernetes.io/name: smoke
    {{- include "costpilot.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke
        {{- include "costpilot.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: smoke
          image: {{ include "costpilot.image" (dict "root" . "repository" .Values.backend.repository) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "src/jobs/smoke.js"]
          env:
            - name: SMOKE_BACKEND_URL
              value: {{ printf "http://%s:%v" .Values.backend.name .Values.backend.port | quote }}
            - name: SMOKE_FRONTEND_URL
              value: "http://frontend"
            - name: EXPECT_VERSION
              value: {{ .Values.image.tag | quote }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            {{- include "costpilot.backendSecurity" . | nindent 12 }}
{{- end }}
