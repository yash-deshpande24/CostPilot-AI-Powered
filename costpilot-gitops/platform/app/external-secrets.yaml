# Installs External Secrets Operator, which copies AWS Secrets Manager values into Kubernetes secrets.
# Apply once: kubectl apply -f gitops/platform/apps/external-secrets.yaml
# VERIFY the version first: helm search repo external-secrets/external-secrets --versions
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.19.2"
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::208805233492:role/costpilot-dev-external-secrets" # from: terraform output eso_role_arn
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
